# Non-secret environment for the ert-uat Cloud Run service (ERT-1260).
#
# Committed on purpose: every value here is reviewable in a pull request, which is
# the point. Secrets never appear -- they arrive through --set-secrets from Secret
# Manager and reach the container as ordinary environment variables, so
# System.getenv picks them up with no code change.
#
# WHY A FILE AND NOT --set-env-vars: CORS_ALLOWED_HOSTS and UPLOAD_MIME_ALLOWLIST
# are comma-separated, and --set-env-vars uses comma as its own delimiter. There
# is an escape syntax; you will get it wrong at 6pm. --env-vars-file avoids the
# trap entirely and has full-replace semantics, so deleting a line here actually
# removes the variable from the service.
#
# REPLACE the placeholder hosts and the database IP during ERT-1260. They are
# marked so a grep finds them.

# staging, not dev. UAT holds real invitations addressed to real people, so it
# takes the strict path: gated docs, gated metrics, real secrets required.
APP_ENV: "staging"

# REPLACE: the Cloud SQL private IP from `gcloud sql instances describe ert-db`.
DATABASE_URL: "jdbc:postgresql://REPLACE_WITH_CLOUD_SQL_PRIVATE_IP:5432/ert_uat"
DATABASE_USER: "ert_uat"

# max_instances (2) x 5 = 10 connections from this service. See the budget
# arithmetic in docs/deployment.md before raising either number.
DATABASE_MAX_POOL_SIZE: "5"

# REPLACE with the UAT hostnames once they exist.
JWT_ISSUER: "https://ert-uat.example.internal/"
JWT_AUDIENCE: "employee-requirements-tracker"
JWT_TTL_MINUTES: "60"
CORS_ALLOWED_HOSTS: "hr-uat.example.internal,portal-uat.example.internal"
PORTAL_BASE_URL: "https://portal-uat.example.internal"

# REQUIRED on the first deploy against an empty users table, and outside dev an
# empty table with this unset REFUSES TO START. The password is a secret and
# comes through --set-secrets; only the address belongs here.
# HR_BOOTSTRAP_EMAIL: "hr.admin@example.internal"

# Stays false until ERT-1010 ships. A staging box pointed at the real relay is
# how a test invitation reaches an actual new hire.
MAIL_ENABLED: "false"

TRACE_USECASES: "false"
