# Non-secret environment for the ert-prod Cloud Run service (ERT-1260).
# See deploy/uat.env.yaml for why this is a file rather than --set-env-vars.
#
# REPLACE the placeholder hosts and the database IP during ERT-1260.

# Unset would also resolve to production since ERT-1120, but stating it is not
# redundant: the startup summary echoes this value, and "it was never set" and
# "it was set to production" read identically in a log otherwise.
APP_ENV: "production"

# REPLACE: the Cloud SQL private IP from `gcloud sql instances describe ert-db`.
# Direct VPC egress to a private IP, so this is a plain JDBC URL and the
# application needed no code change and no extra dependency (ERT-1260).
DATABASE_URL: "jdbc:postgresql://REPLACE_WITH_CLOUD_SQL_PRIVATE_IP:5432/ert"
DATABASE_USER: "ert"

# max_instances (4) x 5 = 20 connections from this service. Adding UAT's 10,
# Flyway's short-lived connections during a deploy, human sessions and Cloud
# SQL's reserved superuser slots comes to roughly 44 at peak. Check the real
# ceiling with `SHOW max_connections;` before raising either number.
DATABASE_MAX_POOL_SIZE: "5"

# REPLACE with the production hostnames.
JWT_ISSUER: "https://ert.example.com/"
JWT_AUDIENCE: "employee-requirements-tracker"

# This is the REVOCATION WINDOW, not just a convenience. The verifier does not
# resolve `sub` against the users table, so deactivating an account or resetting
# a password takes up to this long to bite (JwtIssuer.kt). Sixty minutes is the
# accepted trade; shortening it shortens that window.
JWT_TTL_MINUTES: "60"

# REPLACE. https only -- Http.kt rejects any other scheme -- and an empty value
# means no cross-origin request is permitted at all.
CORS_ALLOWED_HOSTS: "hr.example.com,portal.example.com"

# REPLACE. No trailing slash. The invitation body is rendered at send time and
# never persisted, so a wrong value here cannot be corrected after the fact --
# it means reissuing the credential to every hire invited since the deploy.
PORTAL_BASE_URL: "https://portal.example.com"

# Only read when the users table is empty. Remove this line and the matching
# secret once the first admin has signed in and changed their password -- a live
# credential wired into a service definition for no remaining benefit is a
# standing risk (docs/deployment.md has the lifecycle).
# HR_BOOTSTRAP_EMAIL: "hr.admin@example.com"

MAIL_ENABLED: "false"
TRACE_USECASES: "false"
