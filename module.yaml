product: jvm/app

dependencies:
  - $ktor.serialization.kotlinx.json
  - $ktor.server.auth
  - $ktor.server.auth.jwt
  - $ktor.server.callLogging
  - $ktor.server.contentNegotiation
  - $ktor.server.core
  - $ktor.server.cors
  - $ktor.server.metrics
  - $ktor.server.metrics.micrometer
  - $ktor.server.netty
  - $ktor.server.openapi
  - $ktor.server.sessions
  - $ktor.server.statusPages
  - $ktor.server.swagger
  - $libs.ktor.serverRoutingOpenapi
  - $libs.bcrypt
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.javaTime
  - $libs.exposed.r2dbc
  - $libs.flyway.core
  - $libs.flyway.databasePostgresql
  - $libs.h2database.h2
  - $libs.h2database.r2dbc
  - $libs.hikaricp
  - $libs.koin.ktor
  - $libs.koin.loggerSlf4j
  - $libs.logback.classic
  - $libs.micrometer.registryPrometheus
  - $libs.postgresql

test-dependencies:
  - $ktor.server.testHost
  - $libs.kotest.assertionsCore
  - $libs.kotlinx.coroutinesTest
  - $libs.mockk

settings:
  jvm:
    release: 21
    mainClass: com.pgsystem.employee.requirement.tracker.MainKt
    test:
      # ERT-1120 inverted the default: an unset APP_ENV now means production, so the suite would
      # otherwise refuse to start on a missing JWT_SECRET. This is a real environment variable for
      # the test JVM -- the same input production reads -- so the resolution rule keeps exactly one
      # source and no test-only backdoor was added to a security control.
      extraEnvironment:
        APP_ENV: dev
  ktor:
    enabled: true
    version: 3.5.2
  kotlin:
    serialization: enabled
